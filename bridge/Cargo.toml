[package]
name = "usagedock-bridge"
version = "0.1.0"
edition = "2021"
description = "UsageDock helper: Claude Code status line bridge and Chrome native messaging host"

[[bin]]
name = "usagedock-bridge"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
