[package]
name = "usagedock"
version = "0.1.0"
description = "UsageDock - Windows AI usage monitor"
authors = ["UsageDock"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (cargo#8519).
name = "usagedock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
